session_name: hydra
start_directory: /home/nisemono/Documents/ros_workspaces/hydra_ws

windows:
  - window_name: hydra
    layout: tiled
    panes:
      - roscore

      - sleep 3 && bash -c "source /home/nisemono/catkin_ws/devel/setup.bash && rosparam set use_sim_time true && roslaunch hydra_dsg_builder uhumans2_incremental_dsg.launch"

      - sleep 8 && bash -c "source /home/nisemono/catkin_ws/devel/setup.bash && roslaunch hydra_utils hydra_streaming_visualizer.launch"

      - sleep 8 && bash -c "rosbag play /home/nisemono/data/V1.0/Data/office.bag --clock"
